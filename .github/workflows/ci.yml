name: Agent Monitor CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build self-contained executable
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name agent-monitor --collect-all uvicorn --add-data "monitor/static;monitor/static" --paths . entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent-monitor-windows
          path: dist/agent-monitor.exe
          if-no-files-found: error
