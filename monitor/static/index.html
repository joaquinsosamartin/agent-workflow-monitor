<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Workflow Monitor</title>
<style>
:root{color-scheme:dark;font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif;--bg:#0b1422;--panel:#17263b;--border:#2b405b;--text:#e9f2ff;--muted:#9bb2d0;--green:#59d8ad;--blue:#8ab8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0%,#182f4d,var(--bg) 55%);color:var(--text)}
.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:290px minmax(300px,1fr);min-height:100vh}
aside{border-right:1px solid var(--border);padding:27px 18px}main{padding:32px 40px;max-width:850px;width:100%;margin:auto}
.brand{font-size:17px;font-weight:750;margin-bottom:33px}.brand span{color:var(--blue)}
small,.muted{color:var(--muted)}.eyebrow{color:#86a5d0;letter-spacing:2px;font-size:11px;font-weight:700}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue)}
.run{width:100%;text-align:left;display:block;background:transparent;border:1px solid transparent;padding:13px;margin:8px 0;color:inherit;border-radius:12px}
.run.selected{border-color:#4a6990;background:#1d2e47}.run small{display:block;margin-top:5px}
.run.active-run{border-left:4px solid var(--green);background:#142a34;padding-left:10px;box-shadow:inset 0 0 20px rgba(89,216,173,.035)}
.run.active-run.selected{background:#1c3945;border-color:#477e79}
.run.waiting-run{border-left:4px solid #dcb977;background:#322d24;padding-left:10px}
.run.recent-run{border-left:3px solid #78aaf1;background:#192840;padding-left:11px}
.run.active-run .run-state{color:var(--green)}.run.waiting-run .run-state{color:#f0cf8d}.run.recent-run .run-state{color:#a8c9ff}.run-state{display:inline-block;font-size:11px;color:var(--muted);margin-top:6px}
.run-title{font-size:13px;font-weight:650}
.run-activity{font-size:11px;color:#bdd0ea;margin-top:7px;line-height:1.4}
.run-activity b{color:#8db8ff;font-weight:600}.session-group{margin:22px 0 10px}
.session-header{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--muted);padding:8px 3px;text-align:left;font-size:11px;font-weight:750;letter-spacing:1px}
.session-count{font-size:11px;background:#263d57;color:#c4d7f0;border-radius:20px;padding:2px 7px;letter-spacing:0;margin-left:6px}
.timestamp{color:#829cba;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}.step-time{margin-top:5px}
.activity{margin-top:26px}.activity-list{border:1px solid var(--border);background:#142238;border-radius:13px;margin-top:12px;padding:5px 14px}
.activity-item{border-bottom:1px solid #283c55;padding:11px 0;display:flex;justify-content:space-between;gap:14px;font-size:12px}.activity-item:last-child{border-bottom:0}
.activity-item .timestamp{display:block;margin-top:2px}.activity-item .name{color:#d5e5f8}
.btn{border:1px solid #456996;border-radius:10px;background:#23426b;color:#eef5ff;padding:11px 15px;margin-top:15px}
h1{font-size:27px;letter-spacing:-.7px;margin:15px 0 5px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{border:1px solid #426b93;color:#9cc6ff;border-radius:30px;padding:5px 11px;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:27px 0 35px}
.card{background:#192b42;border:1px solid #304a68;border-radius:15px;padding:16px}.card b{font-size:21px;font-variant-numeric:tabular-nums}.card small{display:block;font-size:11px;margin-top:6px}
.timeline{position:relative;margin-top:20px}.timeline:before{content:"";position:absolute;left:17px;top:19px;bottom:38px;background:#36506b;width:2px}
.step{display:grid;position:relative;grid-template-columns:35px 1fr;gap:16px;margin-bottom:24px}
.circle{width:35px;height:35px;display:grid;place-items:center;border:1px solid #526989;border-radius:50%;background:#1c2d43;position:relative;z-index:1}
.completed .circle{color:var(--green);background:#153b34;border-color:#387968}.running .circle{color:var(--blue);background:#254468}.failed .circle{color:#ff9292}
.heading{background:none;border:0;color:inherit;text-align:left;padding:4px 0;display:flex;justify-content:space-between;gap:12px;width:100%;font-size:15px;font-weight:650}
.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:12px}.good{color:var(--green)}.active{color:var(--blue)}
.children{background:var(--panel);border:1px solid var(--border);border-radius:13px;margin-top:12px;padding:5px 14px}
.child{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;border-bottom:1px solid #30425a;padding:12px 0;font-size:12px}.child:last-child{border-bottom:0}
.child span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.footer{border-top:1px solid var(--border);padding-top:15px;margin-top:20px;color:var(--muted);font-size:12px}
.empty{padding:34px;border:1px dashed var(--border);border-radius:15px;color:var(--muted)}
@media(max-width:750px){.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--border);padding:18px}.brand{margin-bottom:12px}main{padding:20px}.card{padding:11px}.card b{font-size:17px}.cards{gap:7px}}
</style></head>
<body><div class="layout"><aside><div class="brand">◇ Agent Workflow <span>Monitor</span></div>
<div class="eyebrow">EXECUTIONS</div><div id="process-state" class="muted" style="font-size:11px;margin:8px 0 14px"></div><div id="runs"></div>
<button class="btn" id="demo">＋ Crear ejecución de demostración</button><p class="muted">SQLite local · SSE · Sin cloud</p>
</aside><main id="view"><div class="empty">Selecciona una ejecución o crea una demostración.</div></main></div>
<script>
let key="",selected="",stream=null,snapshot=null,inactiveExpanded=false;
let lastRunSignature="",lastSnapshotSignature="",refreshTimer=null,historyExpanded=false,refreshing=false;
const opened=new Set(),closed=new Set();
const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
const money=x=>x==null?"—":"$"+Number(x).toFixed(Number(x)<1?4:2);
const dateTime=value=>{
 if(!value)return "—";
 const d=new Date(value);
 return Number.isNaN(d.getTime())?"—":new Intl.DateTimeFormat("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
};
const compact=x=>x>=1000000?(x/1000000).toFixed(2)+"M":x>=1000?(x/1000).toFixed(1)+"K":String(x);
const label=s=>({pending:"Pendiente",running:"En ejecución",completed:"Completado",failed:"Error",blocked:"Bloqueado",cancelled:"Cancelado",idle:"Inactiva"}[s]||s);
const post=async(path,data)=>{const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Monitor-Key":key},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());return r.json()};
const get=async(path)=>{const r=await fetch(path);if(!r.ok)throw Error(await r.text());return r.json()};
const usageSum=(rows)=>{let t=0,c=0,unknown=false;for(const u of rows){t+=u.input_tokens+u.output_tokens;if(u.cost_usd!=null)c+=Number(u.cost_usd);else unknown=true}return {tokens:t,cost:rows.every(u=>u.cost_usd==null)?null:c,unknown}};
function cumulative(node,nodes,usage){const ids=[node.id];for(let i=0;i<ids.length;i++)ids.push(...nodes.filter(n=>n.parent_id===ids[i]).map(n=>n.id));return usageSum(usage.filter(u=>ids.includes(u.node_id)))}
function txt(parent,tag,cls,value){const x=el(tag,cls,value);parent.append(x);return x}
function childRow(node,nodes,usage,depth=0){
 const u=cumulative(node,nodes,usage),row=el("div","child"),left=el("div"),status=node.status;
 left.style.paddingLeft=(Math.min(depth,3)*12)+"px";
 txt(left,"span",status==="completed"?"good":status==="running"?"active":"muted",
     (status==="completed"?"✓ ":status==="running"?"◌ ":status==="failed"?"! ":"○ ")+node.title);
 if(node.agent)txt(left,"div","muted",node.agent+" · "+label(status));
 txt(left,"div","timestamp step-time",dateTime(node.updated_at));
 row.append(left,el("span","",compact(u.tokens)+" · "+money(u.cost)));
 const holder=el("div");holder.append(row);
 const children=nodes.filter(n=>n.parent_id===node.id);
 if(children.length){
  const toggle=el("button","muted",opened.has(node.id)?"Ocultar "+children.length+" subpasos":"Ver "+children.length+" subpasos");
  toggle.style.cssText="background:transparent;border:0;font-size:11px;padding:4px 0 7px 14px";
  toggle.onclick=()=>{if(opened.has(node.id))opened.delete(node.id);else opened.add(node.id);render(snapshot)};
  holder.append(toggle);
  if(opened.has(node.id))children.slice(0,100).forEach(c=>holder.append(childRow(c,nodes,usage,depth+1)));
 }
 return holder;
}
function stepView(node,index,nodes,usage){
 const wrap=el("section","step "+node.status),circle=el("div","circle",node.status==="completed"?"✓":node.status==="running"?"◌":String(index+1));wrap.append(circle);
 const content=el("div"),heading=el("button","heading"),headingName=el("span","",String(index+1)+". "+node.title),chevron=el("span","muted");
 heading.append(headingName,chevron);content.append(heading);
 const children=nodes.filter(n=>n.parent_id===node.id),open=opened.has(node.id);chevron.textContent=open?"⌃":"⌄";
 const meta=el("div","meta"),tot=cumulative(node,nodes,usage);
 txt(meta,"span",node.provider==="claude"?"active":"good",(node.provider==="claude"?"✧ ":"⌘ ")+(node.agent||"Sin asignar"));
 txt(meta,"span","",label(node.status));txt(meta,"span","",compact(tot.tokens)+" tokens · "+money(tot.cost)+(tot.unknown?"*":""));content.append(meta);
 txt(content,"div","timestamp step-time","Última acción · "+dateTime(node.updated_at));
 if(open&&children.length){const sub=el("div","children");children.slice(0,100).forEach(child=>sub.append(childRow(child,nodes,usage)));content.append(sub)}
 heading.onclick=()=>{if(open){opened.delete(node.id)}else{opened.add(node.id)}render(snapshot)};
 wrap.append(content);return wrap
}
function render(data){snapshot=data;const view=document.querySelector("#view");view.replaceChildren();const run=data.run,roots=data.nodes.filter(n=>!n.parent_id),tot=usageSum(data.usage);
 const header=el("div","header");txt(header,"span","eyebrow","AGENT EXECUTION · "+run.id.substring(0,12));txt(header,"span","badge",label(run.status));view.append(header);
 txt(view,"h1","",run.title);txt(view,"p","muted",(run.project||"Local")+" · Workflow de agentes");
 txt(view,"div","timestamp","Actualizado · "+dateTime(run.updated_at));
 const cards=el("div","cards");for(const item of [[money(tot.cost),"Coste USD"+(tot.unknown?" · parcial":"")],[compact(tot.tokens),"Tokens entrada + salida"],[roots.filter(n=>n.status==="completed").length+"/"+roots.length,"Fases completadas"]]){const c=el("div","card");txt(c,"b","",item[0]);txt(c,"small","",item[1]);cards.append(c)}view.append(cards);
 txt(view,"div","eyebrow","EXECUTION TIMELINE");const timeline=el("div","timeline");roots.forEach((n,i)=>timeline.append(stepView(n,i,data.nodes,data.usage)));view.append(timeline);
 const historyBtn=el("button","btn",historyExpanded?"Ocultar historial de acciones":"Ver historial de acciones");
 historyBtn.setAttribute("aria-expanded",String(historyExpanded));
 historyBtn.onclick=async()=>{historyExpanded=!historyExpanded;render(snapshot);if(historyExpanded)await showHistory(selected)};
 view.append(historyBtn);
 txt(view,"div","footer","◉ SQLite local · Actualización SSE · Costes reportados/estimados según proveedor");
}
function sessionButton(r){
 const active=r.presence==="active",waiting=r.presence==="waiting",recent=r.presence==="recent_unverified";
 const b=el("button","run"+(active?" active-run":waiting?" waiting-run":recent?" recent-run":"")+(r.id===selected?" selected":""));
 txt(b,"div","run-title",r.title);
 txt(b,"small","",r.project||"Local");
 if(r.activity&&(active||waiting||recent)){
  const activity=el("div","run-activity");
  txt(activity,"b","",(r.activity.agent||"Agente")+" · ");
  txt(activity,"span","",r.activity.title);
  b.append(activity);
 }
 const presenceName=active?"Activo · proceso verificado":waiting?"En espera · proceso verificado":recent?"Actividad reciente · sin verificar":"Inactiva / histórica";
 txt(b,"span","run-state",(active?"● ":waiting?"◐ ":recent?"◌ ":"○ ")+presenceName);
 txt(b,"div","timestamp",dateTime(r.updated_at));
 b.onclick=()=>select(r.id);
 return b;
}
async function listRunsNoSelect(){
 const box=document.querySelector("#runs");
 const [runs, processData]=await Promise.all([get("/api/runs"),get("/api/processes")]);
 const state=document.querySelector("#process-state");
 state.textContent=processData.detected_processes+" procesos CLI detectados · "+processData.verified_sessions+" sesiones vinculadas";
 state.title="Los procesos sin identificador de sesión verificable no se asignan a una ejecución";
 const sig=JSON.stringify([runs.map(r=>[r.id,r.title,r.project,r.presence,r.updated_at,r.activity?.title,r.activity?.agent]),selected,inactiveExpanded]);
 if(sig===lastRunSignature)return runs;
 lastRunSignature=sig;
 box.replaceChildren();
 const confirmed=runs.filter(r=>r.presence==="active"||r.presence==="waiting");
 const recent=runs.filter(r=>r.presence==="recent_unverified");
 const inactive=runs.filter(r=>r.presence==="inactive");
 const activeSection=el("section","session-group");
 const activeHeader=el("div","session-header");
 txt(activeHeader,"span","","● PROCESOS VINCULADOS");
 txt(activeHeader,"span","session-count",String(confirmed.length));
 activeSection.append(activeHeader);
 if(confirmed.length)confirmed.forEach(r=>activeSection.append(sessionButton(r)));
 else txt(activeSection,"p","muted","Sin sesiones vinculadas de forma verificable");
 box.append(activeSection);
 if(recent.length){
  const section=el("section","session-group");
  const head=el("div","session-header");
  txt(head,"span","","◌ ACTIVIDAD RECIENTE · SIN VERIFICAR");
  txt(head,"span","session-count",String(recent.length));
  section.append(head);
  const explanation=el("p","muted","Registro reciente; no confirma que siga abierta una ventana");
  explanation.style.fontSize="11px";section.append(explanation);
  recent.forEach(r=>section.append(sessionButton(r)));
  box.append(section);
 }
 const inactiveSection=el("section","session-group");
 const toggle=el("button","session-header");
 toggle.type="button";toggle.setAttribute("aria-expanded",String(inactiveExpanded));
 const heading=el("span","");heading.textContent="⌄ INACTIVAS E HISTÓRICAS";
 txt(heading,"span","session-count",String(inactive.length));
 toggle.append(heading,el("span","",inactiveExpanded?"⌃":"⌄"));
 toggle.onclick=()=>{inactiveExpanded=!inactiveExpanded;listRunsNoSelect().catch(console.error)};
 inactiveSection.append(toggle);
 if(inactiveExpanded){
  if(inactive.length)inactive.forEach(r=>inactiveSection.append(sessionButton(r)));
  else txt(inactiveSection,"p","muted","Sin sesiones inactivas");
 }
 box.append(inactiveSection);
 return runs;
}
function eventName(item){
 const payload=JSON.parse(item.payload||"{}");
 const id=payload.node_id;
 const node=snapshot?.nodes.find(n=>n.id===id);
 const name=node?.title||"Ejecución";
 if(item.kind==="node.status")return name+" · "+label(payload.status);
 if(item.kind==="run.status")return "Sesión · "+label(payload.status);
 if(item.kind==="usage")return name+" · Consumo de tokens";
 if(item.kind==="log")return name+" · Evento";
 return name+" · "+item.kind;
}
async function showHistory(id){
 const records=await get("/api/runs/"+encodeURIComponent(id)+"/history?limit=40");
 if(id!==selected)return;
 const view=document.querySelector("#view");
 const area=el("section","activity");
 txt(area,"div","eyebrow","HISTORIAL DE ACCIONES");
 const panel=el("div","activity-list");
 const latest=records;
 if(!latest.length)txt(panel,"div","muted","Todavía no hay eventos registrados");
 latest.forEach(record=>{
  const item=el("div","activity-item"),main=el("div");
  txt(main,"div","name",eventName(record));
  txt(main,"div","timestamp",dateTime(record.created_at));
  item.append(main);
  txt(item,"span","muted","#"+record.seq);
  panel.append(item);
 });
 area.append(panel);view.append(area);
}
async function refresh(force=false){
 if(!selected||refreshing)return;
 refreshing=true;
 try{
  const id=selected, data=await get("/api/runs/"+encodeURIComponent(id));
  if(selected!==id)return;
  const sig=JSON.stringify(data);
  if(force||sig!==lastSnapshotSignature){
   lastSnapshotSignature=sig;
   const scroll=window.scrollY;
   render(data);
   if(historyExpanded)await showHistory(id);
   window.scrollTo({top:scroll,behavior:"instant"});
  }
 }catch(e){console.error(e)}
 finally{refreshing=false}
}
function scheduleRefresh(){
 if(refreshTimer)return;
 refreshTimer=setTimeout(async()=>{
   refreshTimer=null;
   await refresh();
   await listRunsNoSelect();
 },2000);
}
async function listRuns(){
 const runs=await listRunsNoSelect();
 if(!selected&&runs.length)await select((runs.find(r=>r.presence==="active")||runs.find(r=>r.presence==="recent_unverified")||runs[0]).id);
}
async function select(id){
 if(selected===id)return;
 selected=id;
 if(stream)stream.close();
 if(refreshTimer){clearTimeout(refreshTimer);refreshTimer=null}
 opened.clear();closed.clear();historyExpanded=false;
 lastSnapshotSignature="";lastRunSignature="";
 const runs=await get("/api/runs");
 if(runs.find(r=>r.id===id&&r.presence==="inactive"))inactiveExpanded=true;
 await refresh(true);
 await listRunsNoSelect();
 stream=new EventSource("/api/runs/"+encodeURIComponent(id)+"/events");
 stream.addEventListener("update",scheduleRefresh);
}
setInterval(async()=>{try{await listRunsNoSelect()}catch(e){console.warn(e)}},5000);
document.querySelector("#demo").onclick=async()=>{try{const r=await post("/api/demo",{});await select(r.id)}catch(e){alert(e.message)}};
(async()=>{try{key=(await get("/api/bootstrap")).key;await listRuns()}catch(e){document.querySelector("#view").textContent="Error al conectar con backend: "+e.message}})();
</script></body></html>
